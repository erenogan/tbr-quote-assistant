services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tbr
      POSTGRES_PASSWORD: tbr
      POSTGRES_DB: tbr
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbr"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy