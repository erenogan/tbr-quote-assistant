services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tbr
      POSTGRES_PASSWORD: tbr
      POSTGRES_DB: tbr
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbr"]
      interval: 3s
      retries: 10